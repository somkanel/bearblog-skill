name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline API tests
        run: python -m unittest discover -s skills/bearblog/scripts -p 'test_*.py' -v
      - name: CLI help
        run: python skills/bearblog/scripts/bearblog.py --help
